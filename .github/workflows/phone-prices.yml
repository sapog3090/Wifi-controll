name: Phone Prices APK

on:
  push:
    branches: ['**']
    paths:
      - 'phone-price-finder/**'
      - '.github/workflows/phone-prices.yml'
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-price-finder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew :core:test --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk phone-prices.apk

      - uses: actions/upload-artifact@v4
        with:
          name: phone-prices-apk
          path: phone-price-finder/phone-prices.apk
