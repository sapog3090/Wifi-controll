[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wifictl"
version = "0.1.0"
description = "Управление своими/авторизованными устройствами по WiFi (LAN) с макросами по ключевому слову"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "websockets>=12.0",
    "PyYAML>=6.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.scripts]
wifictl = "wifictl.cli:main"

[tool.setuptools.packages.find]
include = ["wifictl*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
